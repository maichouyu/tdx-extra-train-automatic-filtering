name: 臺鐵時刻表異動比對

# 僅允許手動觸發 (Workflow Dispatch)
on:
  workflow_dispatch:
    inputs:
      date_normal:
        description: '基準日 (正常日，例如: 2026-11-02)'
        required: true
        default: '2026-11-02'
        type: string
      date_target:
        description: '目標日 (異動日，例如: 2026-11-09)'
        required: true
        default: '2026-11-09'
        type: string

jobs:
  run-comparison:
    runs-on: ubuntu-latest

    steps:
      - name: 簽出專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 執行時刻表比對程式
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
          TDX_CLIENT_ID_2: ${{ secrets.TDX_CLIENT_ID_2 }}
          TDX_CLIENT_SECRET_2: ${{ secrets.TDX_CLIENT_SECRET_2 }}
          TDX_CLIENT_ID_3: ${{ secrets.TDX_CLIENT_ID_3 }}
          TDX_CLIENT_SECRET_3: ${{ secrets.TDX_CLIENT_SECRET_3 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_CHAT_ID_2: ${{ secrets.TG_CHAT_ID_2 }}
          DATE_NORMAL: ${{ inputs.date_normal }}
          DATE_TARGET: ${{ inputs.date_target }}
        run: |
          python compare_trains.py
