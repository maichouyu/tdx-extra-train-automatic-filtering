<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺鐵45天內加班或增停時刻表</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --card-border: #2c2c2c;
            --text-main: #ffffff;
            --text-secondary: #aaaaaa;
            --accent-color: #ff8c00;
            --accent-hover: #ffa500;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 16px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 頂部標題與更新時間 */
        .header-section {
            margin-bottom: 20px;
        }
        .header-section h1 {
            color: var(--accent-color);
            font-size: 1.5rem;
            margin-bottom: 6px;
        }
        .header-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* 搜尋與排序控制列 */
        .controls-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            margin-bottom: 20px;
        }
        @media (max-width: 768px) {
            .controls-section {
                grid-template-columns: 1fr;
            }
        }
        .control-group label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 6px;
        }
        .control-group input, .control-group select {
            width: 100%;
            background: #121212;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .btn-toggle-group {
            display: flex;
            gap: 8px;
        }
        .sort-btn {
            flex: 1;
            background: #121212;
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .sort-btn.active {
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
            border-color: var(--accent-color);
        }

        /* ==================== 特殊列車行駛熱點圖 (小工具) ==================== */
        .heatmap-widget {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            width: 100%;
        }
        .hm-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            cursor: pointer;
        }
        .hm-title {
            font-size: 1rem;
            font-weight: bold;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .hm-toggle-icon {
            font-size: 0.8rem;
            color: var(--text-secondary);
            transition: transform 0.3s;
        }
        .hm-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 12px;
        }
        .hm-month-box {
            background: #121212;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px;
        }
        .hm-month-title {
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-bottom: 8px;
            font-weight: bold;
            text-align: center;
        }
        .hm-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .hm-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .hm-cell {
            aspect-ratio: 1;
            background: #1a1a1a;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            position: relative;
            cursor: default;
            transition: background 0.2s;
        }
        .hm-cell.has-train {
            background: #2a2218;
            border: 1px solid rgba(255, 140, 0, 0.4);
            color: var(--text-main);
            cursor: pointer;
        }
        .hm-cell.has-train:hover {
            background: #3a2e1d;
            border-color: var(--accent-color);
        }
        .hm-dot-container {
            display: flex;
            gap: 2px;
            margin-top: 2px;
        }
        .hm-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--accent-color);
        }

        /* 車次卡片列表區域 (範例) */
        .train-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border-left: 4px solid var(--accent-color);
        }
        .train-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .train-number {
            font-size: 1.3rem;
            font-weight: bold;
        }
        .train-tags {
            display: flex;
            gap: 6px;
        }
        .tag {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            background: #283828;
            color: #4ade80;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 頂部標題 -->
    <div class="header-section">
        <h1>臺鐵45天內加班或增停時刻表</h1>
        <div class="header-meta">
            <span>開行區間：10/31 ~ 12/05</span>
            <span>最後更新於：2026-10-30 15:53:35</span>
        </div>
    </div>

    <!-- 搜尋與排序控制列 -->
    <div class="controls-section">
        <div class="control-group">
            <label>搜尋車次：</label>
            <input type="text" placeholder="輸入車次號碼 (例如: 5210)">
        </div>
        <div class="control-group">
            <label>排序方式：</label>
            <div class="btn-toggle-group">
                <button class="sort-btn active">先日期再車次</button>
                <button class="sort-btn">純車次號碼大小</button>
            </div>
        </div>
    </div>

    <!-- 插入的「特殊列車行駛熱點圖」測試版 -->
    <div class="heatmap-widget" id="heatmapWidget">
        <div class="hm-header" onclick="toggleHeatmap()">
            <div class="hm-title">
                特殊列車行駛熱點日曆 
                <span style="font-size: 0.8rem; color: var(--text-secondary); font-weight: normal;">(點擊展開/收合)</span>
            </div>
            <div class="hm-toggle-icon" id="hmToggleIcon">▼ 展開</div>
        </div>
        <div class="hm-content" id="hmContent" style="display: none;">
            <!-- 10月範例 -->
            <div class="hm-month-box">
                <div class="hm-month-title">2026年 10月</div>
                <div class="hm-weekdays">
                    <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
                </div>
                <div class="hm-grid">
                    <!-- 略過前面空白格簡化示範，直接從31號開始 -->
                    <div class="hm-cell"></div><div class="hm-cell"></div><div class="hm-cell"></div><div class="hm-cell"></div><div class="hm-cell"></div><div class="hm-cell"></div><div class="hm-cell"></div>
                    <div class="hm-cell"></div><div class="hm-cell"></div><div class="hm-cell"></div><div class="hm-cell"></div><div class="hm-cell"></div><div class="hm-cell"></div><div class="hm-cell"></div>
                    <div class="hm-cell"></div><div class="hm-cell"></div><div class="hm-cell"></div><div class="hm-cell"></div><div class="hm-cell"></div><div class="hm-cell"></div><div class="hm-cell"></div>
                    <div class="hm-cell"></div><div class="hm-cell"></div><div class="hm-cell"></div><div class="hm-cell"></div><div class="hm-cell"></div><div class="hm-cell"></div><div class="hm-cell"></div>
                    <div class="hm-cell"></div><div class="hm-cell"></div><div class="hm-cell"></div><div class="hm-cell"></div><div class="hm-cell"></div><div class="hm-cell"></div>
                    <div class="hm-cell has-train" onclick="alert('跳轉到 10/31 車次')">
                        31
                        <div class="hm-dot-container"><div class="hm-dot"></div></div>
                    </div>
                </div>
            </div>
            <!-- 11月範例 -->
            <div class="hm-month-box">
                <div class="hm-month-title">2026年 11月</div>
                <div class="hm-weekdays">
                    <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
                </div>
                <div class="hm-grid">
                    <div class="hm-cell has-train" onclick="alert('跳轉到 11/01 車次')">1<div class="hm-dot-container"><div class="hm-dot"></div></div></div>
                    <div class="hm-cell">2</div>
                    <div class="hm-cell has-train" onclick="alert('跳轉到 11/03 車次')">3<div class="hm-dot-container"><div class="hm-dot"></div></div></div>
                    <!-- 其他簡化格子 -->
                    <div class="hm-cell">4</div><div class="hm-cell">5</div><div class="hm-cell">6</div><div class="hm-cell">7</div>
                    <div class="hm-cell">8</div><div class="hm-cell">9</div><div class="hm-cell">10</div><div class="hm-cell">11</div><div class="hm-cell">12</div><div class="hm-cell">13</div><div class="hm-cell">14</div>
                    <div class="hm-cell">15</div><div class="hm-cell">16</div><div class="hm-cell">17</div><div class="hm-cell">18</div><div class="hm-cell">19</div><div class="hm-cell">20</div><div class="hm-cell">21</div>
                    <div class="hm-cell">22</div><div class="hm-cell">23</div><div class="hm-cell">24</div><div class="hm-cell">25</div><div class="hm-cell">26</div><div class="hm-cell">27</div><div class="hm-cell">28</div>
                    <div class="hm-cell">29</div><div class="hm-cell">30</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 車次卡片列表 (接在熱點圖下方) -->
    <div class="train-card">
        <div class="train-header">
            <div class="train-number">3348 次</div>
            <div class="train-tags">
                <span class="tag">區間</span>
                <span class="tag" style="background: #27272a; color: #a1a1aa;">西部幹線</span>
            </div>
        </div>
        <div style="color: var(--text-secondary); font-size: 0.9rem;">
            枋寮 22:19 -> 臺南 00:42 | 開行日期：10/31
        </div>
    </div>

</div>

<script>
    // 展開/收合熱點圖的互動邏輯
    function toggleHeatmap() {
        const content = document.getElementById('hmContent');
        const icon = document.getElementById('hmToggleIcon');
        if (content.style.display === 'none') {
            content.style.display = 'grid';
            icon.textContent = '▲ 收合';
        } else {
            content.style.display = 'none';
            icon.textContent = '▼ 展開';
        }
    }
</script>

</body>
</html>
