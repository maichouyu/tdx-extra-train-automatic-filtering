<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺鐵45天內加班或增停時刻表</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --text-hint: #a1a1a6;
            --border-color: #e5e5ea;
            --input-bg: #f2f2f7;
            --accent-color: #e67e22;
            --accent-hover: #d35400;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1c1c1e;
            --text-main: #f5f5f7;
            --text-muted: #a1a1a6;
            --text-hint: #6e6e73;
            --border-color: #2c2c2e;
            --input-bg: #2c2c2e;
            --accent-color: #f39c12;
            --accent-hover: #e67e22;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        /* 主題切換按鈕 */
        .theme-toggle {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* 標題區 */
        .main-title {
            color: var(--accent-color);
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0 0 6px 0;
        }

        .subtitle {
            color: var(--accent-color);
            font-size: 0.95rem;
            margin-bottom: 12px;
        }

        .update-time {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        .divider {
            border: none;
            border-top: 1px solid var(--accent-color);
            opacity: 0.6;
            margin-bottom: 20px;
        }

        /* 搜尋與排序 */
        .section-label {
            color: var(--accent-color);
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .search-box {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--accent-color);
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 0.95rem;
            box-sizing: border-box;
            margin-bottom: 20px;
            outline: none;
        }

        .sort-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .sort-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .sort-btn.active {
            background: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        /* --- 熱點圖小工具 (完全符合截圖樣式) --- */
        .hm-widget {
            background: #1c1c1e;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 20px;
            color: #ffffff;
            box-sizing: border-box;
        }

        .hm-header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hm-title {
            color: var(--accent-color);
            font-size: 1.05rem;
            font-weight: bold;
        }

        .hm-sub-text {
            color: #8e8e93;
            font-size: 0.78rem;
            margin-top: 4px;
            margin-bottom: 12px;
        }

        .hm-toggle-btn {
            background: #2c2c2e;
            color: #ffffff;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .hm-month-card {
            background: #2c2c2e;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .hm-month-title {
            text-align: center;
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .hm-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 0.75rem;
            color: #8e8e93;
            margin-bottom: 8px;
        }

        .hm-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .hm-cell {
            aspect-ratio: 1;
            border-radius: 6px;
            background: #1c1c1e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 4px 2px 3px 2px;
            box-sizing: border-box;
            position: relative;
        }

        .hm-cell.empty {
            background: transparent;
        }

        .hm-cell.has-trains {
            cursor: pointer;
            background: #3a3a3c;
        }

        .hm-cell.has-trains:hover {
            border: 1px solid var(--accent-color);
        }

        .hm-num {
            font-size: 0.75rem;
            color: #ffffff;
            line-height: 1;
        }

        .hm-bars {
            display: flex;
            gap: 2px;
            width: 80%;
            height: 3px;
            border-radius: 2px;
            overflow: hidden;
        }

        .hm-bar {
            flex: 1;
            height: 100%;
        }

        .hm-legend {
            display: flex;
            justify-content: center;
            gap: 12px;
            font-size: 0.75rem;
            color: #8e8e93;
            margin-top: 12px;
        }

        .hm-legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .hm-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        /* --- 車次卡片樣式 --- */
        .train-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            border-left: 5px solid #2ecc71;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-top: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .train-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .train-no {
            font-size: 1.6rem;
            font-weight: 800;
            color: #2ecc71;
        }

        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #ffffff;
        }

        .badge-type { background: #2ecc71; }
        .badge-line { background: #636e72; }

        .train-route {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .train-dates {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">深</button>

    <h1 class="main-title">臺鐵45天內加班或增停時刻表</h1>
    <div class="subtitle" id="range-text">開行區間：載入中...</div>
    <div class="update-time" id="update-text">最後更新於：--</div>
    
    <hr class="divider">

    <div class="section-label">搜尋車次：</div>
    <input type="text" class="search-box" id="search-input" placeholder="輸入車次號碼 (例如: 5210)" oninput="filterAndRender()">

    <div class="section-label">排序方式：</div>
    <div class="sort-buttons">
        <button class="sort-btn active" id="sort-date-btn" onclick="setSortMode('date')">先日期再車次</button>
        <button class="sort-btn" id="sort-no-btn" onclick="setSortMode('number')">純車次號碼大小</button>
    </div>

    <!-- 熱點圖預覽 -->
    <div class="hm-widget">
        <div class="hm-header-main">
            <div class="hm-title">行駛日期熱點分佈預覽</div>
            <button class="hm-toggle-btn" id="hm-toggle-btn" onclick="toggleHeatmap()">收合 ▲</button>
        </div>
        <div class="hm-sub-text">點擊日期快速篩選車次</div>

        <div id="hm-body">
            <div id="hm-months-container"></div>

            <div class="hm-legend">
                <span class="hm-legend-item"><span class="hm-dot" style="background:#2ecc71;"></span> 區間車/區間快</span>
                <span class="hm-legend-item"><span class="hm-dot" style="background:#3498db;"></span> 自強號</span>
                <span class="hm-legend-item"><span class="hm-dot" style="background:#e74c3c;"></span> 莒光號</span>
            </div>
        </div>
    </div>

    <!-- 車次清單容器 -->
    <div id="train-list-container"></div>
</div>

<script>
    // 預設測試資料 (若沒有伺服器 JSON 時使用)
    const mockData = {
        "update_time": "2026-10-30 15:53:35",
        "start_date": "10/31",
        "end_date": "12/05",
        "trains": [
            {
                "trainNo": "3348",
                "type": "區間車",
                "line": "西部幹線",
                "route": "枋寮 22:19 -> 臺南 00:42",
                "dates": ["2026-10-31", "2026-11-01", "2026-11-07"]
            },
            {
                "trainNo": "5210",
                "type": "自強號",
                "line": "東部幹線",
                "route": "樹林 07:15 -> 臺東 11:30",
                "dates": ["2026-10-31", "2026-11-02"]
            },
            {
                "trainNo": "5502",
                "type": "莒光號",
                "line": "南迴線",
                "route": "臺東 14:00 -> 高雄 17:20",
                "dates": ["2026-11-01"]
            }
        ]
    };

    let cachedTrains = [];
    let currentSortMode = 'date'; // 'date' 或 'number'

    // 車種顏色定義
    function getTrainColor(type) {
        if (!type) return '#2ecc71';
        if (type.includes('自強')) return '#3498db';
        if (type.includes('莒光')) return '#e74c3c';
        return '#2ecc71'; // 區間車/區間快
    }

    // 初始化 App
    function initApp() {
        // 嘗試載入 last_trains.json，若無則載入預設 Mock 資料
        fetch('last_trains.json')
            .then(res => res.json())
            .then(data => processData(data))
            .catch(() => processData(mockData));
    }

    function processData(data) {
        document.getElementById('range-text').textContent = `開行區間：${data.start_date} ~ ${data.end_date}`;
        document.getElementById('update-text').textContent = `最後更新於：${data.update_time}`;
        
        cachedTrains = data.trains;
        renderHeatmap(cachedTrains);
        filterAndRender();
    }

    // 切換深色/淺色主題
    function toggleTheme() {
        const body = document.body;
        const btn = document.getElementById('theme-btn');
        if (body.getAttribute('data-theme') === 'dark') {
            body.removeAttribute('data-theme');
            btn.textContent = '深';
        } else {
            body.setAttribute('data-theme', 'dark');
            btn.textContent = '淺';
        }
    }

    // 熱點圖收合/展開
    function toggleHeatmap() {
        const body = document.getElementById('hm-body');
        const btn = document.getElementById('hm-toggle-btn');
        if (body.style.display === 'none') {
            body.style.display = 'block';
            btn.textContent = '收合 ▲';
        } else {
            body.style.display = 'none';
            btn.textContent = '展開 ▼';
        }
    }

    // 渲染熱點圖
    function renderHeatmap(trains) {
        const container = document.getElementById('hm-months-container');
        const dateMap = {};

        // 統計各日期開行車次與車種顏色
        trains.forEach(t => {
            const color = getTrainColor(t.type);
            t.dates.forEach(d => {
                if (!dateMap[d]) dateMap[d] = [];
                dateMap[d].push({ trainNo: t.trainNo, color: color });
            });
        });

        const allDates = Object.keys(dateMap).sort();
        if (allDates.length === 0) return;

        // 按月份拆分
        const monthGroups = {};
        allDates.forEach(d => {
            const ym = d.substring(0, 7); // YYYY-MM
            if (!monthGroups[ym]) monthGroups[ym] = [];
            monthGroups[ym].push(d);
        });

        container.innerHTML = '';

        Object.keys(monthGroups).sort().forEach(ym => {
            const [y, m] = ym.split('-');
            const firstDay = new Date(y, parseInt(m) - 1, 1).getDay();
            const totalDays = new Date(y, parseInt(m), 0).getDate();

            let html = `
                <div class="hm-month-card">
                    <div class="hm-month-title">${y}年 ${parseInt(m)}月</div>
                    <div class="hm-weekdays">
                        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
                    </div>
                    <div class="hm-grid">
            `;

            // 補齊月初空格
            for (let i = 0; i < firstDay; i++) {
                html += `<div class="hm-cell empty"></div>`;
            }

            // 繪製日期格
            for (let day = 1; day <= totalDays; day++) {
                const dayStr = String(day).padStart(2, '0');
                const fullDate = `${ym}-${dayStr}`;
                const dayTrains = dateMap[fullDate];

                if (dayTrains && dayTrains.length > 0) {
                    const bars = dayTrains.slice(0, 3).map(item => 
                        `<span class="hm-bar" style="background:${item.color};"></span>`
                    ).join('');

                    html += `
                        <div class="hm-cell has-trains" onclick="selectDate('${fullDate}')" title="${fullDate} (${dayTrains.length}班)">
                            <span class="hm-num">${day}</span>
                            <div class="hm-bars">${bars}</div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="hm-cell">
                            <span class="hm-num" style="opacity: 0.3;">${day}</span>
                        </div>
                    `;
                }
            }

            html += `</div></div>`;
            container.insertAdjacentHTML('beforeend', html);
        });
    }

    // 點擊熱點圖日期進行過濾/捲動
    function selectDate(dateStr) {
        const input = document.getElementById('search-input');
        input.value = dateStr;
        filterAndRender();
    }

    // 設定排序模式
    function setSortMode(mode) {
        currentSortMode = mode;
        document.getElementById('sort-date-btn').classList.toggle('active', mode === 'date');
        document.getElementById('sort-no-btn').classList.toggle('active', mode === 'number');
        filterAndRender();
    }

    // 篩選與渲染車次卡片
    function filterAndRender() {
        const query = document.getElementById('search-input').value.trim().toLowerCase();
        const container = document.getElementById('train-list-container');

        let filtered = cachedTrains.filter(t => {
            const matchesNo = t.trainNo.toLowerCase().includes(query);
            const matchesDate = t.dates.some(d => d.includes(query));
            return matchesNo || matchesDate;
        });

        // 排序 logic
        if (currentSortMode === 'number') {
            filtered.sort((a, b) => parseInt(a.trainNo) - parseInt(b.trainNo));
        } else {
            filtered.sort((a, b) => (a.dates[0] || '').localeCompare(b.dates[0] || '') || parseInt(a.trainNo) - parseInt(b.trainNo));
        }

        container.innerHTML = '';

        if (filtered.length === 0) {
            container.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:20px;">查無符合車次</div>`;
            return;
        }

        filtered.forEach(t => {
            const color = getTrainColor(t.type);
            const card = document.createElement('div');
            card.className = 'train-card';
            card.style.borderLeftColor = color;

            card.innerHTML = `
                <div class="train-header">
                    <span class="train-no" style="color:${color};">${t.trainNo} 次</span>
                    <span class="badge badge-type" style="background:${color};">${t.type}</span>
                    <span class="badge badge-line">${t.line}</span>
                </div>
                <div class="train-route">${t.route}</div>
                <div class="train-dates">行駛日期：${t.dates.join(', ')}</div>
            `;
            container.appendChild(card);
        });
    }

    // 啟動程式
    window.onload = initApp;
</script>

</body>
</html>
